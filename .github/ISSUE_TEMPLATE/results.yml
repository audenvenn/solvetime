name: Results from your Mac
description: Send in runs made with solvetime on your Mac (any Apple silicon, any memory size).
title: "Results: <Mac model>, <chip>, <memory> GB, <engines>"
labels: ["results"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Results from other Macs are what this project is for. Before you start:
        1. Make the bundle: `solvetime submit results/`. It replaces your home directory, your Mac's names and
           any email address in the files, and adds `machine.json`.
        2. Check it: `solvetime validate <bundle>.tar.gz`. It replays every attempt in the sandbox and
           re-scores it.
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Model, chip, GPU cores and memory.
      placeholder: "MacBook Air (2024), M3, 10-core GPU, 16 GB"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: What you ran
      description: The solvetime commands, with any environment variables you set (SOLVETIME_GGUF and so on).
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `solvetime doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: validate
    attributes:
      label: Output of `solvetime validate <bundle>`
      render: text
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: The bundle
      description: Drag the .tar.gz from `solvetime submit` here.
    validations:
      required: true
  - type: checkboxes
    id: conditions
    attributes:
      label: Conditions
      options:
        - label: The Mac was on AC power.
        - label: Other large apps were closed while it ran.
        - label: I did not change solvetime's code, tasks or settings (if you did, say how below).
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Other apps that were open, anything unusual during the runs, settings you changed.
