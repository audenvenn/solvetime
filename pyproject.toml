[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvetime"
version = "0.1.0.dev0"
description = "How long a Mac takes to finish coding tasks with a local model: solved tasks and time to solution, per engine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mini-swe-agent==2.4.6",  # the agent is pinned: every engine gets the same one
    "pyyaml>=6",
]

[project.scripts]
solvetime = "solvetime.__main__:main"

[tool.setuptools]
packages = ["solvetime"]

[tool.setuptools.package-data]
solvetime = ["data/*.txt"]
